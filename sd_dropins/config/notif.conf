notif_volume=80
alert=on
warning=on
success=on
info=on
ping=on
# Custom sound per level. Value = a .wav filename in /config/notification/
# (bare name is auto-prefixed with that folder). Leave a line out / commented
# to use the built-in tone for that level.
# REQUIRED WAV FORMAT: 16-bit PCM, 22050 Hz, MONO.
#   ffmpeg -i in.mp3 -ar 22050 -ac 1 -acodec pcm_s16le alert.wav
alert_file=alert.wav
warning_file=warning.wav
success_file=success.wav
info_file=info.wav
ping_file=ping.wav
