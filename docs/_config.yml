title: Al-Anqa Docs
description: Al-Anqa offensive security firmware for LilyGo T-Deck — hacker CLI in your pocket.
url: "https://abdallahnatsheh.github.io"
baseurl: "/AL-ANQA-FIRMWARE"

theme: just-the-docs
color_scheme: alanqa


footer_content: "Al-Anqa &mdash; your network never saw it coming."

nav_sort: case_sensitive

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-polyglot

# ── i18n (jekyll-polyglot) ────────────────────────────────────────────────
# English is the default (served at /...); Arabic is served under /ar/...
# Pages with no `lang` render in BOTH languages (English content is the
# fallback under /ar/). A page with `lang: ar` overrides the fallback for
# that URL. The language switcher lives in _includes/nav_footer_custom.html.
languages: ["en", "ar"]
default_lang: "en"
exclude_from_localization: ["assets", "javascript", "images"]
parallel_localization: false

aux_links:
  "GitHub":
    - "https://github.com/abdallahnatsheh/AL-ANQA-FIRMWARE"

aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/abdallahnatsheh/AL-ANQA-FIRMWARE"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"
